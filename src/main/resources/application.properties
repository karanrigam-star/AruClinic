# AruClinic Healthcare Management System - Application Properties

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aruclinicdb?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:aruclinic_app}
spring.datasource.password=${DB_PASSWORD:AppSecurePassword@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration (Production Optimized)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=15000

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Application Secrets
jwt.secret=${JWT_SECRET:9xT7mP4qLs8Kd2NwV5bHr1YzC6eFa3Jk8LmNp2Qr7StUv9WxABCDEFGHIJKLMNOPQRSTUVWXYZabcdef}
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.issuer=AruClinic

# Server & HTTPS Proxy Configuration
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Vaadin Configuration
vaadin.productionMode=${VAADIN_PRODUCTION_MODE:false}
vaadin.terminal.idle-timeout-enabled=true
vaadin.terminal.idle-timeout=15

# Logging Configuration
logging.level.org.springframework.boot.autoconfigure.security=WARN
logging.level.com.aruclinic=INFO

# Sample Data Seeding (Default false for production safety)
app.data.seed=${APP_DATA_SEED:false}

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true