# AruClinic Healthcare Management System - Application Properties

# Database Configuration (Supports Railway MYSQL_URL, Render DB_URL, SPRING_DATASOURCE_URL, and embedded H2 fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:${DATABASE_URL:${DB_URL:jdbc:h2:mem:aruclinicdb;DB_CLOSE_DELAY=-1;MODE=MySQL}}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${DB_USERNAME:sa}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${DB_PASSWORD:}}}

# HikariCP Connection Pool Configuration (Production Optimized)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=15000

# JPA Configuration (Hibernate auto-detects MySQL vs H2 dialect dynamically)
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true

# Application Secrets
jwt.secret=${JWT_SECRET:9xT7mP4qLs8Kd2NwV5bHr1YzC6eFa3Jk8LmNp2Qr7StUv9WxABCDEFGHIJKLMNOPQRSTUVWXYZabcdef}
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.issuer=AruClinic

# Server & HTTPS Proxy Configuration
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Vaadin Configuration
vaadin.productionMode=${VAADIN_PRODUCTION_MODE:false}
vaadin.terminal.idle-timeout-enabled=true
vaadin.terminal.idle-timeout=15

# Logging Configuration
logging.level.org.springframework.boot.autoconfigure.security=WARN
logging.level.com.aruclinic=INFO

# Sample Data Seeding (Default false for production safety)
app.data.seed=${APP_DATA_SEED:false}

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true